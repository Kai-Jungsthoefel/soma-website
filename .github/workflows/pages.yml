# Baut die statische Seite und veröffentlicht sie auf GitHub Pages (https://somacad.app).
# Täglich neu, damit Release-Daten und Sterne auch ohne Commit im HTML aktuell sind.
# Die Modelle (public/models) baut niemand hier: dafür braucht es soma, sie liegen fertig im Repo.
name: Deploy website

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Höheres Limit für die GitHub-API in scripts/fetch-github.mjs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
